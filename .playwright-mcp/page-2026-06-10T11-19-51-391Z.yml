      - generic [ref=e326]:
        - heading "Building Artifact" [level=2] [ref=e327]
        - paragraph [ref=e328]: "Hours before a review, we had the work spread across four different formats: an After Effects MP4, a Figma file, an Origami prototype, and a Quick-hosted website, but no cohesive way to present it all together. So we did what felt natural at Shopify: we hacked something. A blank HTML page, a horizontal carousel with overflow scroll, an iframe, an embedded video. It took less than an hour. We used it to give the presentation that afternoon, scrolling left to right through each piece as we talked through the narrative. It worked."
        - paragraph [ref=e329]: That kind of improvisation is common here. Shopify has long been a company of tinkerers — people who default to building over buying, who reach for code before they reach for a vendor. AI has only accelerated this. Across the organization, designers, engineers, PMs, and even non-technical teams are now building tools, prototypes, and internal utilities that would have taken weeks a few years ago. When there’s a gap in the workflow, the default response is no longer “find a SaaS tool.” It’s “build something.”
        - paragraph [ref=e330]: "But this bias toward making has a downside: every project generates a trail of outputs — static images, motion files, coded prototypes hosted on Quick, Figma explorations, pieces of writing — scattered across formats and platforms with no real way to connect them. Good work gets lost. Concepts that did not survive a review disappear into folders. Prototypes that inspired a team internally never reach the broader organization. The issue was never making things. It was finding it later, and understanding where it came from."
        - paragraph [ref=e331]: "We built Artifact to solve this, and we built it entirely in code. The first prototype was that crude carousel, and from there we extended outward: a slider to control how many columns were visible at once, support for additional media types, grouping, pages. Only after the full interaction model was working did we open Figma and spend a day or two designing components for patterns we had already proven in the product itself. The tool informed the design, not the other way around."
        - paragraph [ref=e332]: The pivot came during a project review. As we were walking through the work, one of the directors stopped us and asked, “What are you using to present this?”. The whole conversation shifted. She saw something we had been too close to notice — the container was as valuable as the content. She wanted it rolled out across the organization.
        - paragraph [ref=e333]: "Shopify already had Studio, an internal Dribbble-like tool for the design org. But it lacked a real feedback loop: uploads were sporadic, engagement was low, and little happened after something was posted. We merged Studio into Artifact, creating two sides: a feed for publishing and discovery, and a project view for organizing work into collections and pages. That made unfinished, unshipped, or previously abandoned work useful again, letting one team’s artifacts become another team’s reference point."
        - paragraph [ref=e334]: Adoption has been strong. We connected a Slack feedback channel to an internal agent that turns feature requests and bug reports into pull requests against the Artifact repo, so the broader design org can now contribute to the tool directly. What started as a hack built in under an hour before a presentation is now shared infrastructure — a place where work accumulates rather than evaporates.
        - paragraph [ref=e335]: The lesson we keep returning to is bigger than Artifact. The best internal tools do not begin with a roadmap; they begin with an immediate problem, solved out of necessity.